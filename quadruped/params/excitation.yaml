# What perturbs the robot during collection, and why each one is admissible.
#
# THE RULE: an excitation is admissible iff it enters through a quantity the model reads,
# or through the initial condition. Anything else leaves an unexplained acceleration, and
# adding a channel for it produces an input that is identically zero at fine-tuning time.

# TWO RATES, AND THEY ARE NOT INTERCHANGEABLE.
# Recording is 100 Hz and control is 50 Hz, so the policy acts on every second recorded
# row. Training windows are built on RECORDED rows, so every segmentation figure below is
# in recorded rows at dt = 0.01. Computing them at the control rate instead doubles every
# duration and makes a feasible schedule look impossible -- which it did, once.
episode:
  duration_s: 20.0          # requested; the patch may shorten it, see below
  min_duration_s: 6.0       # below this an episode yields no full training window
  record_hz: 100          # dt 0.01; the rate segmentation and training windows use
  control_hz: 50          # dt 0.02; the rate the policy and injection act at

action_injection:
  # NOT optional, and not decoration. Measured on the previous corpus: only ~4% of action
  # variance survives conditioning on the state, over an effectively rank-2 subspace of a
  # 12-dimensional action. A model fit to that can ignore the action entirely and still
  # fit -- while d s'/d a is the single quantity fine-tuning consumes.
  enabled: true
  kind: ou                        # Ornstein-Uhlenbeck on the joint target
  # Per-step i.i.d. noise is REJECTED: at 50 Hz on a position target it sits above the
  # bandwidth the PD loop and leg inertia can follow, so the target moves and the body
  # does not. That yields action variance with no state response, which teaches the model
  # that actions barely matter -- the opposite of what is needed.
  tau_s: 0.15                     # correlation time, ~7 control steps; inside the band
  per_joint_independent: true     # shared noise would leave the residual low-rank
  sigma_rad:
    distribution: log_uniform     # one corpus spans scales, as the dose ladder spans volume
    # CALIBRATED, not guessed. Measured on rigid, 20 s episodes, 2 episodes per point:
    #
    #   sigma   surviving  eff_rank   truncated
    #   0.02      3.7%       5.98        0%
    #   0.06     10.6%       6.71        0%
    #   0.12     21.2%       7.86        0%
    #   0.20     29.2%       8.96        0%
    #   0.35     34.1%      10.02       50%     <- the robot starts falling
    #
    # "surviving" is the fraction of action variance left after conditioning on the state,
    # which is the only part that can identify d s'/d a. The PREVIOUS corpus managed 4%
    # over an effective rank of 2 in a 12-dimensional action, which is why a model fit to
    # it could ignore the action and still fit.
    #
    # The range below sits where identifiability is high and the truncation rate is still
    # zero. It stops well short of 0.35, where half the episodes fall: injection past the
    # point where the robot stays up produces wreckage, not data.
    low: 0.10
    high: 0.22                    # ceiling is empirical; see calibration below
  applied: after_policy_before_actuation
  logged: applied                 # log the INJECTED target. Logging the clean one would
                                  # recreate the confound while hiding it.

probes:
  # Single-joint excitation on a minority of episodes. This is finite-differencing the
  # Jacobian inside the data, and it is what Gate 2 compares against Chrono.
  # OU covers the coordinated multi-joint directions a policy actually explores; probes
  # pin down the individual columns. Neither alone does both.
  enabled: true
  fraction: 0.15
  kind: single_joint_chirp
  joints_per_episode: 1
  # A per-episode sampling RANGE, drawn log-uniform for the same reason the injection
  # sigma is: one corpus should span scales.
  amplitude_rad: [0.02, 0.12]
  # The SWEEP endpoints of a single chirp, f0 -> f1. Not a range to draw a tone from:
  # the point of a chirp is that it excites a band in one episode.
  chirp_hz: [0.5, 6.0]

push:
  # Admissible ONLY because the push window never enters the corpus. The recovery after a
  # shove is fully explainable -- post-push velocity and pose are in the state -- and is
  # exactly the off-manifold coverage we want. The interval during which the force acts is
  # not, because its cause is not a model input.
  enabled: true
  direction: uniform_sphere       # NOT the previous +/-16.7 degree disc. Sampled as
                                  # z ~ U(-1,1), theta ~ U(0,2pi), r = sqrt(1-z^2), then
                                  # scaled -- so it is a unit direction and "peak N" means
                                  # what it says. The old sampler was not normalised and
                                  # its magnitude varied with elevation.
  magnitude_n:
    distribution: log_uniform
    low: 8.0
    high: 140.0
  duration_s: 0.10
  events_per_episode: 2           # NOT a Poisson stream every 2 s: see segmentation
  torque: disabled                # the torque channel was never driven; carrying it adds
                                  # three identically-zero inputs

  segmentation:
    # Rows are never deleted in place. Windows are built inside an episode as
    # length - sequence_length + 1, so removing rows from the middle silently produces
    # windows that span a temporal jump. Episodes are SPLIT instead.
    split_at_pushes: true
    guard_steps: 2                # dropped either side of the force window
    # Window count is superlinear in segment length: 1,475 rows at S=128 gives 1,348
    # windows, but seven 190-row segments give 441. So the push schedule is sized around
    # the training window rather than inherited.
    # 2x the training window of 128, in RECORDED rows. Was 512, chosen as "4x the
    # window", which was stricter than anything required: at 512 a single push needs a
    # 10.4 s episode and the travel budget cuts most episodes to about 8 s, so almost
    # nothing could carry a push. At 256 one push needs 5.3 s and two need 8.0 s, and the
    # window cost is identical -- both keep 79% of an 800-row episode's windows, because
    # what costs windows is SPLITTING, not the floor. Long-horizon evaluation does not
    # depend on this: the no-push long-run episodes supply the full-length segments.
    min_segment_rows: 256
    # FEASIBILITY IS A CONSTRAINT, NOT A PREFERENCE, and PushSchedule raises rather than
    # quietly emitting short segments. Per event the drop budget is
    #   ceil(duration_s/dt) + 2*guard_steps + 1 = 10 + 4 + 1 = 15 rows
    # so N recorded pushes need (N+1)*512 + N*15 rows:
    #   1 push  -> 1,039 rows = 10.39 s
    #   2 pushes -> 1,566 rows = 15.66 s
    #   3 pushes -> 2,093 rows = 20.93 s   (does NOT fit a 20 s episode)
    # At 20 s (2,000 rows) two recorded pushes fit with slack. Three do not, and the
    # scheduler will say so at construction rather than after the simulation.

initial_state:
  # The cheapest form of the same coverage. A push delivered during unrecorded warmup
  # costs no segments at all and produces the same off-nominal starting state.
  randomised: true
  warmup_push: true               # push during warmup, before recording starts
  # Matched to the training reset (reset_root_state_uniform): velocity +/-0.5 on every
  # linear and angular axis, yaw uniform. Starting a corpus from a narrower reset than the
  # policy was trained from would collect only the easy part of its own basin.
  joint_offset_rad: [-0.15, 0.15]
  base_vel_mps: [-0.5, 0.5]
  base_tilt_rad: [-0.15, 0.15]   # ROLL AND PITCH ONLY. Yaw is not tilt, and the state is
                                 # yaw-free by construction, so a randomised yaw would be
                                 # an excitation the model cannot see -- inadmissible under
                                 # the rule at the top of this file. Heading variation
                                 # belongs in the command families.
  base_height_offset_m: [-0.04, 0.04]

commands:
  # Eight structured families from the old tree, plus two that close the gap it left.
  #
  # The command is NOT a model input -- the NN-ROM never sees it -- so this is a
  # state-space excitation mechanism and the question is only what gets visited.
  # Structured families buy TEMPORAL STRUCTURE (vel_step, stop_and_go and weave produce
  # accelerations and gait transitions that a constant command never reaches) and
  # AXIS-ISOLATED REGIMES (pure pivot, pure lateral, which a uniform triple would almost
  # never produce). What they miss is the INTERIOR: only `arc` mixes axes and nothing
  # drives all three. `random` and `random_walk` cover that, as additions rather than
  # replacements.
  families: [constant, vel_step, arc, lateral, pivot, weave, yaw_step, stop_and_go,
             random, random_walk]
  stratified: true          # balanced assignment then shuffled, not drawn per episode
  # The policy was trained with the command RESAMPLED every 10 s, so a step change
  # mid-episode is a transient it expects and was optimised against. Holding one command
  # for a whole episode is the off-nominal case, not the nominal one. Applied on top of
  # the family schedule, so a family still shapes the command and this changes its draw.
  resample_s: 10.0
  seed_fn: crc32            # not hash(): PYTHONHASHSEED salting broke replay once

  # MEASURED ON THIS POLICY, on rigid, 6 s per point, body-frame tracking:
  #   vx   -1.0: 83%   0.5: 98%   1.0: 103%   1.5: 102%   2.0: 95%
  #   wz    0.5: 130%  1.0: 103%  2.0:  92%   3.0:  86%
  #   vy    0.5: 70%   1.0:  80%
  # It falls nowhere in that envelope. The previous tree's ranges were measured on a
  # DIFFERENT checkpoint, and its notes record that the narrow ranges before them sampled
  # only the band where that policy worked worst, making the plant look like it tracked at
  # 63%. Inheriting a range is the same mistake as inheriting a sign.
  # HOW THE BASE POLICY WAS TRAINED (robot_lab velocity_env_cfg):
  #   lin_vel_x (-1.0, 1.0)   lin_vel_y (-1.0, 1.0)   ang_vel_z (-1.0, 1.0)
  #   episode_length_s 20.0   resampling_time_range (10.0, 10.0)
  # So the policy has NEVER seen a command past 1.0 on any axis. Our own envelope sweep
  # shows it still tracks at 95% out to vx 2.0, but that is the policy extrapolating from
  # its own training, and a corpus built mostly out there would be collected in a regime
  # the policy was never fit for.
  #
  # The ranges below stay inside training on vy and wz and stretch to 1.5 on vx, which is
  # comfortably beyond any fine-tuning target of ~0.5 -- which is the point, since the
  # corpus must cover where a fine-tuned policy will go -- while staying near the regime
  # the policy handles reliably.
  ranges:
    vx:       [-1.0, 1.5]
    vy:       [-1.0, 1.0]
    wz:       [-1.5, 1.5]
    vx0:      [-1.0, 1.5]
    vx1:      [-1.0, 1.5]
    wz1:      [-1.5, 1.5]
    wz_amp:   [0.2, 1.5]
    t_switch: [4.0, 12.0]
    freq:     [0.05, 0.30]
    period:   [2.0, 6.0]
    tau:      [1.0, 5.0]

calibration:
  # The first job on the new pipeline. The usable injection ceiling is empirical: enough
  # injection and the robot simply falls. The two gates make it self-correcting -- too
  # little fails Gate 1 action identifiability, too much spikes the truncation rate.
  sweep: sigma_rad
  measure: [truncation_rate, action_residual_variance, action_residual_rank]
  sets: action_injection.sigma_rad

not_copied_from_training:
  # robot_lab randomises actuator stiffness and damping by 0.5x to 2.0x per reset
  # (randomize_actuator_gains). That is excellent for a policy, which learns to be robust
  # to it, and INADMISSIBLE here under this file's own rule: the gain changes how a target
  # becomes a torque, nothing in the 36-D state says what the gain is, and two episodes
  # with identical state and action would evolve differently. It is the payload problem
  # exactly. It could be admitted as a per-episode channel, like payload_kg, but it is not
  # admitted by default.
  actuator_gain_randomisation: {reason: "unobserved parameter; would need its own channel"}

  # Training pushes with push_by_setting_velocity, which SETS the base velocity rather
  # than applying a force: an instantaneous jump with no cause in (state, action). That is
  # strictly unmodelable rather than merely unlogged, which is a stronger reason to excise
  # the window than the force case. Our pushes stay force-based and segmented; the
  # training magnitude, +/-0.5 m/s every 10-15 s, is useful mainly as evidence of what
  # disturbance the policy already absorbs.
  velocity_teleport_push: {reason: "a state discontinuity cannot be predicted from (s, a)"}
