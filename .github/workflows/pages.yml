name: Deploy project page

# Publishes web/ to GitHub Pages at https://uwsbel.github.io/NeDM/
#
# `enablement: true` below makes the first successful run create the Pages
# site itself, so no one has to visit Settings -> Pages first. It cannot work
# around the plan restriction, though: GitHub Pages needs the repository to be
# public unless the owning account is on Pro/Team/Enterprise. While uwsbel/NeDM
# is private under a Free org, every run fails at configure-pages with
# "Get Pages site failed ... Not Found". Make the repo public, or upgrade the
# org, and this workflow starts working with no edits.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false            # Pages cannot serve LFS pointers; web/ holds real files.

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
