# Channel sets. Moved out of module globals so a preset is data, not code.
#
# The 36-D baseline is the closure of the control interface: everything the controller
# reads plus everything the objective reads. The previous study bracketed it from both
# sides -- below it nothing runs at any accuracy, and no enrichment above it beat it.

base: &base
  - vel_body_x_mps
  - vel_body_y_mps
  - roll_rad
  - pitch_rad
  - roll_rate_radps
  - ang_vel_body_y_radps
  - yaw_rate_radps

joints: &joints
  # Chrono order: RR, RL, FR, FL. The policy uses FR, FL, RR, RL; see transforms.py.
  - joint_rr_hip_pos_rad
  - joint_rr_thigh_pos_rad
  - joint_rr_calf_pos_rad
  - joint_rl_hip_pos_rad
  - joint_rl_thigh_pos_rad
  - joint_rl_calf_pos_rad
  - joint_fr_hip_pos_rad
  - joint_fr_thigh_pos_rad
  - joint_fr_calf_pos_rad
  - joint_fl_hip_pos_rad
  - joint_fl_thigh_pos_rad
  - joint_fl_calf_pos_rad
  - joint_rr_hip_vel_radps
  - joint_rr_thigh_vel_radps
  - joint_rr_calf_vel_radps
  - joint_rl_hip_vel_radps
  - joint_rl_thigh_vel_radps
  - joint_rl_calf_vel_radps
  - joint_fr_hip_vel_radps
  - joint_fr_thigh_vel_radps
  - joint_fr_calf_vel_radps
  - joint_fl_hip_vel_radps
  - joint_fl_thigh_vel_radps
  - joint_fl_calf_vel_radps

gravity: &gravity [grav_body_x, grav_body_y, grav_body_z]
height:  &height  [pos_z_m, vel_body_z_mps]

presets:

  crm_baseline:
    dim: 36
    fields: [*base, *joints, *gravity, *height]
    note: >
      The default. grav_body_* are derived from the quaternion, not from logged
      roll/pitch, which does not reproduce Chrono's value.

  crm_perturb:
    dim: 39
    fields: [*base, *joints, *gravity, *height,
             [perturb_body_x_n, perturb_body_y_n, perturb_body_z_n]]
    note: >
      Baseline plus the push in the BODY frame, derived from the logged world-frame force
      and the quaternion. Three channels, not six: the torque channel was never driven.
      Kept as an option for a corpus with sustained or frequent disturbance. It is NOT the
      answer for an impulse corpus, where the channel is zero on ~97% of rows and zero at
      fine-tuning time -- there, segmentation is the right tool.

  # Channel study (2026-09-25): what should a reduced model of CRM walking carry beyond the
  # control interface? Each adds logged foot/soil channels to the 36-D baseline; all come
  # from the same go2_crm_v2 rows, so only the propagated state differs.
  crm_forcez:
    dim: 40
    fields: [*base, *joints, *gravity, *height, [foot_fl_force_fz_n, foot_fr_force_fz_n, foot_rl_force_fz_n, foot_rr_force_fz_n]]
    note: Baseline plus the four foot normal contact forces (FSI force on each foot).
  crm_sinkage:
    dim: 40
    fields: [*base, *joints, *gravity, *height, [foot_fl_sinkage_m, foot_fr_sinkage_m, foot_rl_sinkage_m, foot_rr_sinkage_m]]
    note: Baseline plus the four foot sinkages below the soil surface, the soil-state channel.
  crm_soil:
    dim: 44
    fields: [*base, *joints, *gravity, *height, [foot_fl_force_fz_n, foot_fr_force_fz_n, foot_rl_force_fz_n, foot_rr_force_fz_n], [foot_fl_sinkage_m, foot_fr_sinkage_m, foot_rl_sinkage_m, foot_rr_sinkage_m]]
    note: Baseline plus normal forces and sinkages together.
  crm_force3d:
    dim: 48
    fields: [*base, *joints, *gravity, *height, [foot_fl_force_fz_n, foot_fl_force_fx_n, foot_fl_force_fy_n, foot_fr_force_fz_n, foot_fr_force_fx_n, foot_fr_force_fy_n, foot_rl_force_fz_n, foot_rl_force_fx_n, foot_rl_force_fy_n, foot_rr_force_fz_n, foot_rr_force_fx_n, foot_rr_force_fy_n]]
    note: Baseline plus the full 3-D contact force on each foot (normal and traction).

actions:
  # 12 joint position targets, Chrono order.
  fields:
    - joint_rr_hip_target_rad
    - joint_rr_thigh_target_rad
    - joint_rr_calf_target_rad
    - joint_rl_hip_target_rad
    - joint_rl_thigh_target_rad
    - joint_rl_calf_target_rad
    - joint_fr_hip_target_rad
    - joint_fr_thigh_target_rad
    - joint_fr_calf_target_rad
    - joint_fl_hip_target_rad
    - joint_fl_thigh_target_rad
    - joint_fl_calf_target_rad

rollout:
  # Recovered analytically outside the propagated state, so errdist is the same physical
  # quantity in the same units regardless of how many channels a preset carries.
  fields: [pos_x_m, pos_y_m, yaw_rad]
